services:
  mysql:
    ports: ['3306:3306']
  redis:
    ports: ['6379:6379']
  minio:
    ports: ['9000:9000', '9001:9001']
  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['mc']
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET:-logicommerce-local}']
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-logicommerce}:${S3_SECRET_KEY:-logicommerce_local_storage}@minio:9000
    networks: [data]
    restart: 'no'
  mailpit:
    ports: ['1025:1025', '8025:8025']
  api:
    depends_on:
      minio-init:
        condition: service_completed_successfully
  worker:
    depends_on:
      minio-init:
        condition: service_completed_successfully

networks:
  data:
    internal: false
