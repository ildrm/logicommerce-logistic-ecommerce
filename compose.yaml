name: logicommerce

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-mysql://logicommerce:logicommerce_local@mysql:3306/logicommerce}
  DATABASE_HOST: mysql
  DATABASE_PORT: 3306
  DATABASE_USER: ${DATABASE_USER:-logicommerce}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-logicommerce_local}
  DATABASE_NAME: ${DATABASE_NAME:-logicommerce}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-at-least-32-random-characters}
  JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER:-replace-with-a-different-32-character-secret}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-replace-with-a-different-field-encryption-secret}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-10}
  AUTH_REFRESH_RATE_LIMIT_MAX: ${AUTH_REFRESH_RATE_LIMIT_MAX:-30}
  AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-mock}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  COINBASE_API_KEY_ID: ${COINBASE_API_KEY_ID:-}
  COINBASE_API_KEY_SECRET: ${COINBASE_API_KEY_SECRET:-}
  COINBASE_WEBHOOK_SECRET: ${COINBASE_WEBHOOK_SECRET:-}
  COMMERCE_ADAPTER: ${COMMERCE_ADAPTER:-deterministic}
  COMMERCE_PROVIDER_URL: ${COMMERCE_PROVIDER_URL:-}
  COMMERCE_PROVIDER_TOKEN: ${COMMERCE_PROVIDER_TOKEN:-}
  CARRIER_ADAPTER: ${CARRIER_ADAPTER:-deterministic}
  CARRIER_PROVIDER_URL: ${CARRIER_PROVIDER_URL:-}
  CARRIER_PROVIDER_TOKEN: ${CARRIER_PROVIDER_TOKEN:-}
  IDENTITY_VERIFICATION_ADAPTER: ${IDENTITY_VERIFICATION_ADAPTER:-deterministic}
  IDENTITY_VERIFICATION_URL: ${IDENTITY_VERIFICATION_URL:-}
  IDENTITY_VERIFICATION_TOKEN: ${IDENTITY_VERIFICATION_TOKEN:-}
  C2C_PAYMENT_ADAPTER: ${C2C_PAYMENT_ADAPTER:-deterministic}
  C2C_PAYMENT_PROVIDER_URL: ${C2C_PAYMENT_PROVIDER_URL:-}
  C2C_PAYMENT_PROVIDER_TOKEN: ${C2C_PAYMENT_PROVIDER_TOKEN:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-logicommerce-local}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-logicommerce}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-logicommerce_local_storage}
  DOCUMENT_SCANNER_ADAPTER: ${DOCUMENT_SCANNER_ADAPTER:-deterministic}
  DOCUMENT_SCANNER_URL: ${DOCUMENT_SCANNER_URL:-}
  DOCUMENT_SCANNER_TOKEN: ${DOCUMENT_SCANNER_TOKEN:-}
  EMAIL_ADAPTER: ${EMAIL_ADAPTER:-preview}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@logicommerce.local}
  PARTNER_WEBHOOK_ADAPTER: ${PARTNER_WEBHOOK_ADAPTER:-deterministic}
  PARTNER_WEBHOOK_ALLOWED_HOSTS: ${PARTNER_WEBHOOK_ALLOWED_HOSTS:-}
  PARTNER_WEBHOOK_TIMEOUT_MS: ${PARTNER_WEBHOOK_TIMEOUT_MS:-5000}
  PROVIDER_HTTP_TIMEOUT_MS: ${PROVIDER_HTTP_TIMEOUT_MS:-10000}
  PROVIDER_HTTP_MAX_RESPONSE_BYTES: ${PROVIDER_HTTP_MAX_RESPONSE_BYTES:-1048576}
  OUTBOX_QUEUE_NAME: ${OUTBOX_QUEUE_NAME:-logicommerce-domain-events}

x-app-dependencies: &app-dependencies
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-logicommerce}
      MYSQL_USER: ${DATABASE_USER:-logicommerce}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-logicommerce_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_only}
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-logicommerce}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-logicommerce_local_storage}
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.8
    networks: [data, app]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dependencies
    command: ['pnpm', 'db:deploy']
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    networks: [data]
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *app-environment
      API_PORT: 3001
    depends_on: *app-dependencies
    networks: [app, data]
    init: true
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *app-environment
    depends_on: *app-dependencies
    networks: [data]
    init: true
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    init: true

  reverse-proxy:
    image: nginx:1.29-alpine
    volumes:
      - ./infrastructure/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - '8080:8080'
    networks: [app]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  app:
  data:
    internal: true

volumes:
  mysql-data:
  redis-data:
  minio-data:
