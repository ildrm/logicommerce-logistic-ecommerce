name: logicommerce

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-mysql://logicommerce:logicommerce_local@mysql:3306/logicommerce}
  DATABASE_HOST: mysql
  DATABASE_PORT: 3306
  DATABASE_USER: ${DATABASE_USER:-logicommerce}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-logicommerce_local}
  DATABASE_NAME: ${DATABASE_NAME:-logicommerce}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-at-least-32-random-characters}
  JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER:-replace-with-a-different-32-character-secret}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-10}
  AUTH_REFRESH_RATE_LIMIT_MAX: ${AUTH_REFRESH_RATE_LIMIT_MAX:-30}
  AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}

x-app-dependencies: &app-dependencies
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-logicommerce}
      MYSQL_USER: ${DATABASE_USER:-logicommerce}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-logicommerce_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_only}
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-logicommerce}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-logicommerce_local_storage}
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.8
    networks: [data, app]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dependencies
    command: ['pnpm', 'db:deploy']
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    networks: [data]
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *app-environment
      API_PORT: 3001
    depends_on: *app-dependencies
    networks: [app, data]
    init: true
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *app-environment
    depends_on: *app-dependencies
    networks: [data]
    init: true
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    init: true

  reverse-proxy:
    image: nginx:1.29-alpine
    volumes:
      - ./infrastructure/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - '8080:8080'
    networks: [app]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  app:
  data:
    internal: true

volumes:
  mysql-data:
  redis-data:
  minio-data:
