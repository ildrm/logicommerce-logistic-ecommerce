packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

peerDependencyRules:
  allowedVersions:
    '@fastify/static': 10.1.2

overrides:
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  find-my-way@9.6.0: 9.7.0
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  lodash@4.17.21: 4.18.1
  'nanoid@<3.3.18': 3.3.18
  path-to-regexp@8.3.0: 8.4.2
  'postcss@<=8.5.22': 8.5.23
  sharp@0.34.5: 0.35.3
  'uuid@<11.1.1': 11.1.1
  'valibot@<=1.4.1': 1.4.2

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - '@prisma/adapter-mariadb@7.9.0'
  - '@prisma/client-runtime-utils@7.9.0'
  - '@prisma/client@7.9.0'
  - '@prisma/config@7.9.0'
  - '@prisma/debug@7.9.0'
  - '@prisma/driver-adapter-utils@7.9.0'
  - '@prisma/engines@7.9.0'
  - '@prisma/fetch-engine@7.9.0'
  - '@prisma/get-platform@7.9.0'
  - prisma@7.9.0
