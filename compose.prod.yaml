services:
  mysql:
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:?Set DATABASE_NAME for production}
      MYSQL_USER: ${DATABASE_USER:?Set DATABASE_USER for production}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD for production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD for production}
    deploy:
      resources:
        limits: { memory: 2G }
  redis:
    deploy:
      resources:
        limits: { memory: 768M }
  minio:
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY for production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY for production}
  migrate:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for production}
  api:
    environment:
      NODE_ENV: production
      COOKIE_SECURE: 'true'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for production}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL for production}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET for production}
      JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER:?Set JWT_REFRESH_PEPPER for production}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY for production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS for production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL for production}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:?Set PAYMENT_ADAPTER for production}
      COMMERCE_ADAPTER: ${COMMERCE_ADAPTER:?Set COMMERCE_ADAPTER for production}
      COMMERCE_PROVIDER_URL: ${COMMERCE_PROVIDER_URL:?Set COMMERCE_PROVIDER_URL for production}
      COMMERCE_PROVIDER_TOKEN: ${COMMERCE_PROVIDER_TOKEN:?Set COMMERCE_PROVIDER_TOKEN for production}
      CARRIER_ADAPTER: ${CARRIER_ADAPTER:?Set CARRIER_ADAPTER for production}
      CARRIER_PROVIDER_URL: ${CARRIER_PROVIDER_URL:?Set CARRIER_PROVIDER_URL for production}
      CARRIER_PROVIDER_TOKEN: ${CARRIER_PROVIDER_TOKEN:?Set CARRIER_PROVIDER_TOKEN for production}
      IDENTITY_VERIFICATION_ADAPTER: ${IDENTITY_VERIFICATION_ADAPTER:?Set IDENTITY_VERIFICATION_ADAPTER for production}
      IDENTITY_VERIFICATION_URL: ${IDENTITY_VERIFICATION_URL:?Set IDENTITY_VERIFICATION_URL for production}
      IDENTITY_VERIFICATION_TOKEN: ${IDENTITY_VERIFICATION_TOKEN:?Set IDENTITY_VERIFICATION_TOKEN for production}
      C2C_PAYMENT_ADAPTER: ${C2C_PAYMENT_ADAPTER:?Set C2C_PAYMENT_ADAPTER for production}
      C2C_PAYMENT_PROVIDER_URL: ${C2C_PAYMENT_PROVIDER_URL:?Set C2C_PAYMENT_PROVIDER_URL for production}
      C2C_PAYMENT_PROVIDER_TOKEN: ${C2C_PAYMENT_PROVIDER_TOKEN:?Set C2C_PAYMENT_PROVIDER_TOKEN for production}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT for production}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT for production}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY for production}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY for production}
      DOCUMENT_SCANNER_ADAPTER: ${DOCUMENT_SCANNER_ADAPTER:?Set DOCUMENT_SCANNER_ADAPTER for production}
      DOCUMENT_SCANNER_URL: ${DOCUMENT_SCANNER_URL:?Set DOCUMENT_SCANNER_URL for production}
      DOCUMENT_SCANNER_TOKEN: ${DOCUMENT_SCANNER_TOKEN:?Set DOCUMENT_SCANNER_TOKEN for production}
      EMAIL_ADAPTER: ${EMAIL_ADAPTER:?Set EMAIL_ADAPTER for production}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST for production}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT for production}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE for production}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER for production}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD for production}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM for production}
      PARTNER_WEBHOOK_ALLOWED_HOSTS: ${PARTNER_WEBHOOK_ALLOWED_HOSTS:?Set PARTNER_WEBHOOK_ALLOWED_HOSTS for production}
    deploy:
      resources:
        limits: { memory: 768M }
  worker:
    environment:
      NODE_ENV: production
      COOKIE_SECURE: 'true'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for production}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL for production}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET for production}
      JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER:?Set JWT_REFRESH_PEPPER for production}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY for production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS for production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL for production}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:?Set PAYMENT_ADAPTER for production}
      COMMERCE_ADAPTER: ${COMMERCE_ADAPTER:?Set COMMERCE_ADAPTER for production}
      COMMERCE_PROVIDER_URL: ${COMMERCE_PROVIDER_URL:?Set COMMERCE_PROVIDER_URL for production}
      COMMERCE_PROVIDER_TOKEN: ${COMMERCE_PROVIDER_TOKEN:?Set COMMERCE_PROVIDER_TOKEN for production}
      CARRIER_ADAPTER: ${CARRIER_ADAPTER:?Set CARRIER_ADAPTER for production}
      CARRIER_PROVIDER_URL: ${CARRIER_PROVIDER_URL:?Set CARRIER_PROVIDER_URL for production}
      CARRIER_PROVIDER_TOKEN: ${CARRIER_PROVIDER_TOKEN:?Set CARRIER_PROVIDER_TOKEN for production}
      IDENTITY_VERIFICATION_ADAPTER: ${IDENTITY_VERIFICATION_ADAPTER:?Set IDENTITY_VERIFICATION_ADAPTER for production}
      IDENTITY_VERIFICATION_URL: ${IDENTITY_VERIFICATION_URL:?Set IDENTITY_VERIFICATION_URL for production}
      IDENTITY_VERIFICATION_TOKEN: ${IDENTITY_VERIFICATION_TOKEN:?Set IDENTITY_VERIFICATION_TOKEN for production}
      C2C_PAYMENT_ADAPTER: ${C2C_PAYMENT_ADAPTER:?Set C2C_PAYMENT_ADAPTER for production}
      C2C_PAYMENT_PROVIDER_URL: ${C2C_PAYMENT_PROVIDER_URL:?Set C2C_PAYMENT_PROVIDER_URL for production}
      C2C_PAYMENT_PROVIDER_TOKEN: ${C2C_PAYMENT_PROVIDER_TOKEN:?Set C2C_PAYMENT_PROVIDER_TOKEN for production}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT for production}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT for production}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY for production}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY for production}
      DOCUMENT_SCANNER_ADAPTER: ${DOCUMENT_SCANNER_ADAPTER:?Set DOCUMENT_SCANNER_ADAPTER for production}
      DOCUMENT_SCANNER_URL: ${DOCUMENT_SCANNER_URL:?Set DOCUMENT_SCANNER_URL for production}
      DOCUMENT_SCANNER_TOKEN: ${DOCUMENT_SCANNER_TOKEN:?Set DOCUMENT_SCANNER_TOKEN for production}
      EMAIL_ADAPTER: ${EMAIL_ADAPTER:?Set EMAIL_ADAPTER for production}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST for production}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT for production}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE for production}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER for production}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD for production}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM for production}
      PARTNER_WEBHOOK_ALLOWED_HOSTS: ${PARTNER_WEBHOOK_ALLOWED_HOSTS:?Set PARTNER_WEBHOOK_ALLOWED_HOSTS for production}
    deploy:
      resources:
        limits: { memory: 1G }
  web:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL for production}
    deploy:
      resources:
        limits: { memory: 512M }
