name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet

  containers:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.web .
      - run: docker build -f Dockerfile.api .
      - run: docker build -f Dockerfile.worker .

  phase-integration:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.15.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose up --build -d
      - run: docker compose run --rm migrate pnpm db:seed
      - run: pnpm test:auth:live
      - run: docker compose exec -T redis redis-cli FLUSHDB
      - run: pnpm test:commerce:live
      - run: docker compose exec -T redis redis-cli FLUSHDB
      - run: pnpm test:network:live
      - run: docker compose exec -T redis redis-cli FLUSHDB
      - run: pnpm test:phase8-11:live
      - run: docker compose exec -T redis redis-cli FLUSHDB
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=500
      - if: always()
        run: docker compose down --volumes

  security:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: anchore/sbom-action@v0.20.5
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: logicommerce-sbom
          path: sbom.cdx.json
